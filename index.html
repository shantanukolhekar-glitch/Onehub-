<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Car Racing Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#05070a;
  color:white;
  overflow:hidden;
  touch-action:none;
}

#app{
  width:100%;
  max-width:600px;
  height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#111;
}

/* ========== GARAGE ========== */

#garage{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 35%,#27313d 0%,#10151c 45%,#05070a 100%);
}

.topbar{
  height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:rgba(0,0,0,.45);
  border-bottom:1px solid #303846;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{color:#ffc400;}

.coinBox{
  background:#1a2029;
  border:1px solid #3c4654;
  border-radius:12px;
  padding:10px 15px;
  font-weight:bold;
  color:#ffd34d;
}

.garageTitle{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  letter-spacing:4px;
  margin:22px 0 5px;
}

.previewArea{
  height:260px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* REALISTIC CSS CAR */

.car{
  width:245px;
  height:105px;
  position:relative;
  border-radius:25px 45px 20px 20px;
  background:linear-gradient(135deg,#ff4141,#900b0b);
  box-shadow:0 25px 35px rgba(0,0,0,.65);
}

.car .roof{
  position:absolute;
  width:135px;
  height:65px;
  left:55px;
  top:-48px;
  border-radius:65px 65px 8px 8px;
  background:linear-gradient(135deg,#92b9d2,#253845);
  border:4px solid rgba(0,0,0,.55);
}

.car .windowLine{
  position:absolute;
  width:4px;
  height:58px;
  left:120px;
  top:-43px;
  background:#111;
  transform:skew(-8deg);
  z-index:2;
}

.car .wheel{
  position:absolute;
  width:55px;
  height:55px;
  bottom:-24px;
  border-radius:50%;
  background:
    radial-gradient(circle,#aeb5ba 0 18%,#333 20% 35%,#080808 37% 65%,#303030 67%);
  border:5px solid #080808;
  z-index:5;
}

.car .w1{left:25px;}
.car .w2{right:25px;}

.car .light{
  position:absolute;
  width:25px;
  height:13px;
  top:25px;
  right:5px;
  background:#ffe77a;
  border-radius:8px 3px 3px 8px;
  box-shadow:0 0 15px #ffd900;
}

.car .grill{
  position:absolute;
  width:70px;
  height:17px;
  right:25px;
  bottom:13px;
  border-radius:8px;
  background:#151515;
}

.previewCar{
  transform:scale(.95);
}

.car.red{
  background:linear-gradient(135deg,#ff4545,#8d0808);
}

.car.blue{
  background:linear-gradient(135deg,#4ab7ff,#07538c);
}

.car.yellow{
  background:linear-gradient(135deg,#ffe04b,#c47b00);
}

.cards{
  display:flex;
  gap:8px;
  padding:5px 10px;
  justify-content:center;
}

.card{
  width:32%;
  height:160px;
  padding:12px 5px;
  text-align:center;
  border:2px solid #303946;
  border-radius:14px;
  background:linear-gradient(#1c222b,#10151b);
}

.card.active{
  border-color:#ffc400;
  box-shadow:0 0 20px rgba(255,196,0,.25);
}

.miniCar{
  transform:scale(.35);
  transform-origin:center;
  height:55px;
  margin-top:0;
}

.carName{
  font-size:13px;
  font-weight:bold;
}

.carPrice{
  color:#ffc400;
  font-size:12px;
  margin-top:8px;
}

#playBtn{
  width:85%;
  margin:20px auto;
  padding:17px;
  border:0;
  border-radius:15px;
  background:linear-gradient(#98e900,#4f9800);
  color:white;
  font-size:22px;
  font-weight:bold;
}

/* ========== GAME ========== */

#game{
  display:none;
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#76b9eb;
}

/* SKY */

#sky{
  position:absolute;
  inset:0 0 45% 0;
  background:linear-gradient(#4aa1e6,#aee1ff);
}

/* MOUNTAINS */

.mountain{
  position:absolute;
  bottom:48%;
  width:0;
  height:0;
  border-left:170px solid transparent;
  border-right:170px solid transparent;
  border-bottom:200px solid #566b72;
}

.mountain.one{left:-120px;}
.mountain.two{right:-120px;border-bottom-color:#45575e;}

/* GRASS */

#ground{
  position:absolute;
  top:35%;
  bottom:0;
  width:100%;
  background:
    repeating-linear-gradient(
      90deg,
      #426d36 0 60px,
      #4b783b 60px 120px
    );
}

/* ROAD */

#road{
  position:absolute;
  width:78%;
  height:100%;
  left:11%;
  top:0;
  overflow:hidden;
  background:#35383e;
  border-left:7px solid white;
  border-right:7px solid white;
  box-shadow:0 0 20px rgba(0,0,0,.5);
}

.roadLine{
  position:absolute;
  width:9px;
  height:105px;
  left:50%;
  transform:translateX(-50%);
  background:white;
}

/* TREES */

.tree{
  position:absolute;
  width:30px;
  height:60px;
  z-index:2;
}

.tree:before{
  content:"";
  position:absolute;
  width:7px;
  height:35px;
  background:#5b3820;
  bottom:0;
  left:12px;
}

.tree:after{
  content:"";
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#2f7336;
  top:0;
  left:-3px;
}

/* HUD */

#hud{
  position:absolute;
  top:15px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 15px;
  z-index:30;
}

.hudBox{
  padding:11px 14px;
  border-radius:14px;
  background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.18);
  font-size:17px;
  font-weight:bold;
}

#speedText{color:#ffd13d;}

/* PLAYER */

#player{
  position:absolute;
  width:90px;
  height:145px;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  z-index:15;
  transition:left .08s linear;
}

#player .car{
  width:90px;
  height:145px;
  border-radius:25px 25px 20px 20px;
  background:linear-gradient(135deg,#ff4141,#8d0808);
}

#player .roof{
  width:58px;
  height:60px;
  left:16px;
  top:18px;
  border-radius:20px 20px 10px 10px;
  background:linear-gradient(#b9e7ff,#527080);
}

#player .windowLine{
  width:4px;
  height:55px;
  left:43px;
  top:20px;
}

#player .wheel{
  width:25px;
  height:45px;
  bottom:22px;
  border-radius:10px;
  background:#090909;
  border:0;
}

#player .w1{left:-9px;}
#player .w2{right:-9px;}

#player .light{
  width:18px;
  height:15px;
  top:5px;
  right:8px;
}

/* ENEMY */

.enemy{
  position:absolute;
  width:72px;
  height:120px;
  z-index:10;
}

.enemy .car{
  width:72px;
  height:120px;
  border-radius:20px;
}

.enemy .roof{
  width:45px;
  height:45px;
  left:14px;
  top:15px;
}

.enemy .wheel{
  width:20px;
  height:38px;
  bottom:20px;
}

.enemy .w1{left:-7px;}
.enemy .w2{right:-7px;}

/* CONTROLS */

#controls{
  position:absolute;
  bottom:18px;
  width:100%;
  padding:0 30px;
  display:flex;
  justify-content:space-between;
  z-index:40;
}

.control{
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.55);
  background:rgba(0,0,0,.45);
  color:white;
  font-size:35px;
}

/* GAME OVER */

#gameOver{
  display:none;
  position:absolute;
  inset:0;
  z-index:100;
  text-align:center;
  padding-top:38vh;
  background:rgba(0,0,0,.8);
}

#gameOver h1{
  color:#ff4848;
  font-size:42px;
}

#restart{
  margin-top:20px;
  padding:15px 35px;
  border:0;
  border-radius:12px;
  color:white;
  background:#58a800;
  font-size:20px;
}

/* BACK */

#back{
  position:absolute;
  top:80px;
  left:15px;
  z-index:50;
  width:48px;
  height:48px;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:24px;
}

</style>
</head>

<body>

<div id="app">

<!-- GARAGE -->

<div id="garage">

  <div class="topbar">
    <div class="logo">CAR <span>RACING</span></div>
    <div class="coinBox">🪙 <span id="coins">0</span></div>
  </div>

  <div class="garageTitle">GARAGE</div>

  <div class="previewArea">
    <div class="car previewCar red" id="previewCar">
      <div class="roof"></div>
      <div class="windowLine"></div>
      <div class="wheel w1"></div>
      <div class="wheel w2"></div>
      <div class="light"></div>
      <div class="grill"></div>
    </div>
  </div>

  <div class="cards">

    <div class="card active" onclick="selectCar(0,this)">
      <div class="car miniCar red">
        <div class="roof"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
      </div>
      <div class="carName">SPORTS</div>
      <div class="carPrice">FREE</div>
    </div>

    <div class="card" onclick="selectCar(1,this)">
      <div class="car miniCar blue">
        <div class="roof"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
      </div>
      <div class="carName">BLUE GT</div>
      <div class="carPrice">🪙 100</div>
    </div>

    <div class="card" onclick="selectCar(2,this)">
      <div class="car miniCar yellow">
        <div class="roof"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
      </div>
      <div class="carName">SUPER</div>
      <div class="carPrice">🪙 250</div>
    </div>

  </div>

  <button id="playBtn" onclick="startGame()">▶ PLAY GAME</button>

</div>


<!-- GAME -->

<div id="game">

  <div id="sky"></div>
  <div id="ground"></div>

  <div class="mountain one"></div>
  <div class="mountain two"></div>

  <div id="road"></div>

  <div id="hud">
    <div class="hudBox">🏆 Score: <span id="score">0</span></div>
    <div class="hudBox">⚡ <span id="speedText">120</span> KM/H</div>
  </div>

  <button id="back" onclick="goGarage()">⌂</button>

  <div id="player">
    <div class="car red" id="playerCar">
      <div class="roof"></div>
      <div class="windowLine"></div>
      <div class="wheel w1"></div>
      <div class="wheel w2"></div>
      <div class="light"></div>
    </div>
  </div>

  <div id="controls">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>

  <div id="gameOver">
    <h1>CRASH! 💥</h1>
    <p style="margin-top:15px;font-size:22px;">
      Final Score: <span id="finalScore">0</span>
    </p>
    <button id="restart" onclick="startGame()">RESTART</button>
  </div>

</div>

</div>

<script>

const app = document.getElementById("app");
const game = document.getElementById("game");
const garage = document.getElementById("garage");
const road = document.getElementById("road");
const player = document.getElementById("player");
const playerCar = document.getElementById("playerCar");

let selected = 0;
let playerX = 0;
let score = 0;
let speed = 6;
let running = false;
let enemies = [];
let lines = [];
let trees = [];

const carClasses = ["red","blue","yellow"];

/* ROAD LINES */

for(let i=0;i<8;i++){
  let line=document.createElement("div");
  line.className="roadLine";
  line.style.top=(i*150)+"px";
  road.appendChild(line);
  lines.push(line);
}

/* TREES */

for(let i=0;i<12;i++){
  let tree=document.createElement("div");
  tree.className="tree";
  tree.style.top=(180+i*170)+"px";

  if(i%2===0){
    tree.style.left=(Math.random()*10)+"%";
  }else{
    tree.style.right=(Math.random()*10)+"%";
  }

  game.appendChild(tree);
  trees.push(tree);
}

/* SELECT CAR */

function selectCar(num,element){

  selected=num;

  document.querySelectorAll(".card")
    .forEach(x=>x.classList.remove("active"));

  element.classList.add("active");

  let preview=document.getElementById("previewCar");

  preview.className="car previewCar "+carClasses[num];
}

/* START */

function startGame(){

  garage.style.display="none";
  game.style.display="block";

  document.getElementById("gameOver").style.display="none";

  enemies.forEach(e=>e.remove());
  enemies=[];

  score=0;
  speed=6;

  document.getElementById("score").innerText=0;

  playerCar.className="car "+carClasses[selected];

  playerX=app.clientWidth/2;
  player.style.left=playerX+"px";

  createEnemies();

  running=true;

  requestAnimationFrame(loop);
}

/* CREATE ENEMIES */

function createEnemies(){

  for(let i=0;i<4;i++){

    let enemy=document.createElement("div");
    enemy.className="enemy";

    let c=document.createElement("div");

    c.className="car "+carClasses[Math.floor(Math.random()*3)];

    c.innerHTML=`
      <div class="roof"></div>
      <div class="wheel w1"></div>
      <div class="wheel w2"></div>
      <div class="light"></div>
    `;

    enemy.appendChild(c);

    enemy.style.top=(-180-i*260)+"px";
    enemy.style.left=(18+Math.random()*62)+"%";

    game.appendChild(enemy);
    enemies.push(enemy);
  }
}

/* GAME LOOP */

function loop(){

  if(!running)return;

  lines.forEach(line=>{
    let y=parseFloat(line.style.top);
    y+=speed*1.7;

    if(y>app.clientHeight)y=-110;

    line.style.top=y+"px";
  });

  trees.forEach(tree=>{
    let y=parseFloat(tree.style.top);
    y+=speed*.8;

    if(y>app.clientHeight)y=-80;

    tree.style.top=y+"px";
  });

  enemies.forEach(enemy=>{

    let y=enemy.offsetTop;
    y+=speed;

    if(y>app.clientHeight){
      y=-180;
      enemy.style.left=(18+Math.random()*62)+"%";
      score+=10;

      document.getElementById("score").innerText=score;

      if(score%50===0)speed+=.5;
    }

    enemy.style.top=y+"px";

    if(hit(player,enemy)){
      endGame();
    }

  });

  document.getElementById("speedText").innerText=
    Math.floor(120+score/8);

  requestAnimationFrame(loop);
}

/* COLLISION */

function hit(a,b){

  let x=a.getBoundingClientRect();
  let y=b.getBoundingClientRect();

  return !(
    x.bottom<y.top ||
    x.top>y.bottom ||
    x.right<y.left ||
    x.left>y.right
  );
}

/* MOVEMENT */

function moveLeft(){

  if(!running)return;

  playerX-=42;

  let min=app.clientWidth*.17;

  if(playerX<min)playerX=min;

  player.style.left=playerX+"px";
}

function moveRight(){

  if(!running)return;

  playerX+=42;

  let max=app.clientWidth*.83;

  if(playerX>max)playerX=max;

  player.style.left=playerX+"px";
}

document.getElementById("left")
  .addEventListener("click",moveLeft);

document.getElementById("right")
  .addEventListener("click",moveRight);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")moveLeft();
  if(e.key==="ArrowRight")moveRight();
});

/* GAME OVER */

function endGame(){

  running=false;

  document.getElementById("finalScore").innerText=score;
  document.getElementById("gameOver").style.display="block";
}

/* GARAGE */

function goGarage(){

  running=false;

  enemies.forEach(e=>e.remove());
  enemies=[];

  game.style.display="none";
  garage.style.display="flex";
}

</script>

</body>
</html>
