<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneHub Car Racing</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  overflow:hidden;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100vh;
  max-width:500px;
  margin:auto;
  overflow:hidden;
  background:#555;
}

/* Road */
#road{
  position:absolute;
  width:70%;
  height:100%;
  left:15%;
  background:#333;
  border-left:6px solid white;
  border-right:6px solid white;
}

/* Road lines */
.line{
  position:absolute;
  width:8px;
  height:80px;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

/* Player */
#player{
  position:absolute;
  width:55px;
  height:95px;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#2196f3;
  border-radius:12px;
  border:4px solid white;
  z-index:5;
}

/* Wheels */
#player:before,
#player:after{
  content:"";
  position:absolute;
  width:10px;
  height:25px;
  background:#111;
  top:15px;
}

#player:before{
  left:-8px;
}

#player:after{
  right:-8px;
}

/* Enemy */
.enemy{
  position:absolute;
  width:55px;
  height:95px;
  background:#e53935;
  border-radius:12px;
  border:4px solid white;
  z-index:4;
}

/* Score */
#score{
  position:absolute;
  top:15px;
  left:15px;
  color:white;
  font-size:22px;
  font-weight:bold;
  z-index:10;
}

/* Game over */
#gameOver{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.8);
  color:white;
  z-index:20;
  text-align:center;
  padding-top:35vh;
}

#gameOver h1{
  font-size:40px;
}

button{
  margin-top:20px;
  padding:14px 28px;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  background:#00c853;
  color:white;
}

/* Mobile controls */
.controls{
  position:absolute;
  bottom:15px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
  z-index:15;
}

.controls button{
  width:70px;
  height:55px;
  margin:0;
  background:rgba(255,255,255,.25);
  color:white;
  font-size:25px;
}
</style>
</head>

<body>

<div id="game">

  <div id="road"></div>

  <div id="score">Score: 0</div>

  <div id="player"></div>

  <div id="gameOver">
    <h1>GAME OVER 💥</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">RESTART 🔄</button>
  </div>

  <div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX;
let score = 0;
let speed = 5;
let gameRunning = true;

let enemies = [];
let lines = [];

const road = document.getElementById("road");

/* Create road lines */

for(let i=0;i<6;i++){

  let line=document.createElement("div");

  line.className="line";

  line.style.top=(i*150)+"px";

  road.appendChild(line);

  lines.push(line);
}

/* Create enemy cars */

for(let i=0;i<3;i++){

  let enemy=document.createElement("div");

  enemy.className="enemy";

  enemy.style.top=(-150-i*250)+"px";

  enemy.style.left=
    (20+Math.random()*55)+"%";

  game.appendChild(enemy);

  enemies.push(enemy);
}

/* Player position */

function resetPlayer(){

  playerX =
    (game.clientWidth-player.offsetWidth)/2;

  player.style.left=playerX+"px";
}

resetPlayer();

/* Keyboard */

document.addEventListener("keydown",(e)=>{

  if(e.key==="ArrowLeft"){
    moveLeft();
  }

  if(e.key==="ArrowRight"){
    moveRight();
  }

});

/* Mobile controls */

document.getElementById("left")
.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  moveLeft();
});

document.getElementById("right")
.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  moveRight();
});

/* Movement */

function moveLeft(){

  if(!gameRunning) return;

  playerX-=35;

  const minX=game.clientWidth*0.15+5;

  if(playerX<minX)
    playerX=minX;

  player.style.left=playerX+"px";
}

function moveRight(){

  if(!gameRunning) return;

  playerX+=35;

  const maxX=
    game.clientWidth*0.85-
    player.offsetWidth-5;

  if(playerX>maxX)
    playerX=maxX;

  player.style.left=playerX+"px";
}

/* Collision */

function collision(a,b){

  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();

  return !(
    r1.bottom<r2.top ||
    r1.top>r2.bottom ||
    r1.right<r2.left ||
    r1.left>r2.right
  );
}

/* Game loop */

function gameLoop(){

  if(!gameRunning) return;

  /* Road lines */

  lines.forEach(line=>{

    let top=parseInt(line.style.top);

    top+=speed;

    if(top>game.clientHeight)
      top=-100;

    line.style.top=top+"px";
  });

  /* Enemy cars */

  enemies.forEach(enemy=>{

    let top=enemy.offsetTop;

    top+=speed;

    if(top>game.clientHeight){

      top=-150;

      enemy.style.left=
        (20+Math.random()*55)+"%";

      score++;

      scoreText.innerText=
        "Score: "+score;

      if(score%5===0)
        speed+=0.5;
    }

    enemy.style.top=top+"px";

    if(collision(player,enemy)){
      endGame();
    }

  });

  requestAnimationFrame(gameLoop);
}

/* Game over */

function endGame(){

  gameRunning=false;

  finalScore.innerText=
    "Your Score: "+score;

  gameOver.style.display="block";
}

/* Restart */

function restartGame(){

  score=0;

  speed=5;

  scoreText.innerText="Score: 0";

  gameOver.style.display="none";

  enemies.forEach((enemy,i)=>{

    enemy.style.top=(-150-i*250)+"px";

  });

  resetPlayer();

  gameRunning=true;

  gameLoop();
}

gameLoop();

</script>

</body>
</html>
